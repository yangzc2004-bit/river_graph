[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "river-graph"
version = "0.1.0"
description = "Topology-aware Graph Neural Networks for Reconstructing Sparse Dissolved Organic Carbon Observations in the Mississippi River Basin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pykrige>=1.7",
    "matplotlib>=3.7",
    "networkx>=3.4.2",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
