  <g id="text_30">
   <text style="font-size: 17px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #344f5a" x="74.88" y="33.573344" transform="rotate(-0 74.88 33.573344)">不同真实河流的 DOC 峰：延迟时间不同，展宽较一致</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #344f5a" x="74.88" y="65.124" transform="rotate(-0 74.88 65.124)">统一到原有整点观测；中位数及 95% 月份分块区间；未新增插值或补值</text>
  </g>
  <g id="text_32">
   <text style="font-size: 9px; font-family: 'Arial Unicode MS'; fill: #344f5a" transform="translate(74.88 418.384828)">德国信号已由原作者作 2.5 小时平滑和短缺口补值。加拿大只有 8 次可辨认正响应、6 对完整峰宽，延迟区间触及零。</text>
   <text style="font-size: 9px; font-family: 'Arial Unicode MS'; fill: #344f5a" transform="translate(74.88 429.336)">这里测量的是出口响应；三处流域的气候、水文和观测处理也不同，不能把全部差异归给河网形态。</text>
  </g>
